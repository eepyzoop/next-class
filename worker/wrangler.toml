name = "nextclass-push"
main = "src/index.ts"
compatibility_date = "2026-08-12"

# Created via `wrangler kv namespace create SUBSCRIPTIONS`; id filled in after creation.
[[kv_namespaces]]
binding = "SUBSCRIPTIONS"
id = "51eea37ce73b4283bd64ec822eb69d8f"

# Checks every subscriber's schedule once a minute for due reminders.
[triggers]
crons = ["* * * * *"]

[vars]
VAPID_SUBJECT = "https://eepyzoop.github.io/next-class/"
VAPID_PUBLIC_KEY = "BP4fLFOuSes2ifypR-5K3UwBUa0Dn84-uG7pvId6odLFZNqAUT6gweD_qDx8ughPswsZz2kKpsPY69LD9pHdzrI"
ALLOWED_ORIGIN = "https://eepyzoop.github.io"
# VAPID_PRIVATE_KEY is set as a secret, not a var: `wrangler secret put VAPID_PRIVATE_KEY`
